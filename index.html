<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save the Developer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>SAVE THE DEVEVELOPER</h1>
      <div class="fall-container">
        <div id="falling-man"></div>
        <div class="ground" id="ground"></div>
      </div>
      <div class="code-snippets" id="code-snippets">
        <!-- Dynamically generated code blocks -->
      </div>

      <div class="game-ui">
        <p>Time: <span id="timer">60</span>s</p>
        <p>Level: <span id="level">1</span></p>
        <p>Score: <span id="score">0</span></p>
      </div>

      <button id="start-btn">Begin Rescue!</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
